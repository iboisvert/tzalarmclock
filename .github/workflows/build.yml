name: Build and Unit Test

on:
  push:
    branches: 
      - main
      - dev/*
  pull_request:
    branches:
      - main
      - dev/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 37
        run: sdkmanager "platforms;android-37.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiles every module (app, domain, data, alarm, ui) with R8
      # minification/shrinking on (Stage 10), so keep-rule regressions surface
      # here instead of after release. Does not touch androidTest sources or
      # require a device/emulator.
      - name: Build
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # testReleaseUnitTest covers the Android library/app modules against the
      # same release/R8 variant assembled above; :domain:test is targeted
      # explicitly because domain is a plain Kotlin/JVM module with no build
      # types, so its unit test task is just "test". Neither touches
      # androidTest (instrumented) sources, so no emulator is needed.
      - name: Unit test
        run: ./gradlew testReleaseUnitTest :domain:test --stacktrace --no-daemon

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
